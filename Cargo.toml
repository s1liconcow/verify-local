[workspace]
members = ["crates/verify-protocol", "crates/verify-local", "crates/verify-async"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
